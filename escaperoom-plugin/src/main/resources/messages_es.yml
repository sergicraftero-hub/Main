# ─────────────────────────────────────────────────────────────
#  EscapeRoom — mensajes en español (formato MiniMessage)
#  https://docs.advntr.dev/minimessage/format.html
#  Los marcadores <nombre> se sustituyen por valores reales.
# ─────────────────────────────────────────────────────────────

prefix: "<dark_gray>[<gradient:#ffcf6b:#d4862a>Escape</gradient><dark_gray>] <reset>"
"yes": "sí"
"no": "no"
placeholder-none: "—"

state:
  waiting: "En espera"
  countdown: "Empezando"
  running: "En partida"
  ending: "Terminando"
  resetting: "Reiniciándose"
  disabled: "Desactivada"

# ── General ──
no-permission: "<red>No tienes permiso para hacer eso."
players-only: "<red>Este comando sólo lo puede usar un jugador."
unknown-command: "<red>Subcomando desconocido. Usa <yellow>/escape help</yellow>."
usage: "<gray>Uso: <yellow><usage>"
room-not-found: "<red>No existe ninguna sala llamada <yellow><room></yellow>."
not-in-game: "<red>No estás en ninguna sala."
save-failed: "<red>No se pudo guardar: <error>"
command-blocked: "<red>No puedes usar ese comando durante la partida. <gray>(/escape leave para salir)"
region-blocked: "<red>Esta torre está sellada. <gray>Usa <yellow>/escape join</yellow> para entrar como jugador."
left-region: "<gray>Una fuerza invisible te devuelve al interior..."
inventory-restored: "<green>Se ha restaurado tu inventario de antes de la partida."
death-respawn: "<gray>La torre no te deja morir tan fácilmente... vuelves al inicio de la sala."

help:
  player:
    - "<gradient:#ffcf6b:#d4862a><b>Escape Rooms</b></gradient> <dark_gray>— comandos"
    - " <yellow>/escape join <sala></yellow> <gray>— entrar en la cola de una sala"
    - " <yellow>/escape leave</yellow> <gray>— salir de la cola o de la partida"
    - " <yellow>/escape hint</yellow> <gray>— pedir una pista (cuesta tiempo)"
    - " <yellow>/escape list</yellow> <gray>— salas disponibles"
    - " <yellow>/escape info <sala></yellow> <gray>— información de una sala"
    - " <yellow>/escape top <sala></yellow> <gray>— ranking de una sala"
    - " <yellow>/escape stats [jugador]</yellow> <gray>— estadísticas"
  admin:
    - "<red><b>Administración</b>"
    - " <yellow>/escape wand</yellow> <gray>| <yellow>pos1</yellow> <gray>| <yellow>pos2</yellow> <gray>— seleccionar región"
    - " <yellow>/escape create <id></yellow> <gray>— crear sala con la selección"
    - " <yellow>/escape edit <sala> <propiedad> [valor]</yellow> <gray>— editar"
    - " <yellow>/escape delete <sala> confirm</yellow> <gray>— borrar"
    - " <yellow>/escape snapshot <sala></yellow> <gray>— guardar el estado actual de la sala"
    - " <yellow>/escape start|stop|reset <sala></yellow> <gray>— controlar partidas"
    - " <yellow>/escape puzzles <sala></yellow> <gray>— ver los puzles"
    - " <yellow>/escape setsign <sala></yellow> <gray>— convertir el cartel que miras en cartel de unión"
    - " <yellow>/escape build alquimista [x y z]</yellow> <gray>— construir La Torre del Alquimista"
    - " <yellow>/escape demolish alquimista</yellow> <gray>— demoler el mapa y restaurar el terreno"
    - " <yellow>/escape reload</yellow> <gray>— recargar configuración, mensajes y salas"

# ── Cola y cuenta atrás ──
join-success: "<green>Te has unido a <room><green>. <gray>Jugadores: <white><count></white>/<max> <dark_gray>(mínimo <min>)"
join-other: "<yellow><player></yellow> <gray>se ha unido. <white><count></white><gray>/<max>"
join-queued: "<yellow>Hay una partida en curso en <room><yellow>. Entrarás en la siguiente."
join-full: "<red><room> <red>está llena."
join-disabled: "<red><room> <red>está desactivada ahora mismo."
join-already: "<red>Ya estás en <room><red>."
join-already-other: "<red>Ya estás en <room><red>. Usa <yellow>/escape leave</yellow> primero."
leave-queue: "<gray>Has salido de la cola de <room><gray>."
leave-game: "<gray>Has abandonado <room><gray>. Tu inventario ha sido restaurado."
player-left: "<yellow><player></yellow> <gray>ha abandonado la partida."
player-disconnected: "<yellow><player></yellow> <gray>se ha desconectado y sale de la partida."
mode-solo: "<gray>Te has quedado solo. Los puzles cooperativos tienen ahora una alternativa para un jugador."
countdown-title: "<gradient:#ffcf6b:#d4862a><b><seconds></b></gradient>"
countdown-subtitle: "<gray>Preparaos para <room>"
countdown-actionbar: "<gold>La partida empieza en <white><seconds>s</white> <dark_gray>· <gray><count>/<max> jugadores"
countdown-cancelled: "<red>Cuenta atrás cancelada: no hay jugadores suficientes."
room-resetting: "<gray>La sala se está preparando para la siguiente partida..."
room-ready: "<green><room> <green>está lista."

# ── Partida ──
start-title: "<room>"
start-subtitle-solo: "<gray>Modo solitario · <white><time>"
start-subtitle-team: "<gray>Modo equipo · <white><time>"
start-message-solo: "<gold>¡Que empiece la partida en solitario! <gray>Tienes <white><time></white>. Pistas: <yellow>/escape hint"
start-message-team: "<gold>¡Que empiece la partida en equipo! <gray>Tenéis <white><time></white>. Pistas: <yellow>/escape hint"
bossbar: "<gold>🕯 <white><time></white> <dark_gray>· <gray><solved>/<total> enigmas"
time-warning: "<red>⌛ Quedan <white><time></white>. La vela se consume..."
puzzle-solved: "<green>✔ <puzzle> <dark_gray>— <gray>resuelto por <white><player></white> <dark_gray>(<solved>/<total>)"
puzzle-locked: "<gray>El mecanismo parece bloqueado... todavía."
puzzle-wrong-code: "<red>✘ <puzzle><red>: combinación incorrecta."
puzzle-code-input: "<gold>Código: <white><code>"
puzzle-key-needed: "<gray>Está cerrado. Quizá necesites algo para abrirlo."
puzzle-plates-progress: "<gold>Placas pulsadas: <white><pressed>/<total>"
puzzle-plates-solo: "<yellow>Al estar solo, encuentras un <b>Yunque Pesado</b>. <gray>Colócalo sobre una placa con clic derecho."
puzzle-plates-weight: "<gray>El yunque cae con un golpe sordo sobre la placa."
puzzle-placement-wrong: "<red>✘ <puzzle><red>: no es el orden correcto. Las macetas se vacían."
puzzle-riddle: "<gold>Acertijo: <question>"
puzzle-cauldron-progress: "<gold>El caldero contiene <white><added>/<total></white> ingredientes."
puzzle-cauldron-useless: "<gray>Eso no parece útil para la mezcla."
puzzle-cauldron-already: "<gray>Ese ingrediente ya está en el caldero."
puzzle-cauldron-ruined: "<red>¡La mezcla burbujea, se ennegrece y escupe los ingredientes! <gray>El orden era incorrecto."

# ── Pistas ──
hint: "<light_purple>✦ Pista <level>/<levels></light_purple> <dark_gray>(<puzzle><dark_gray>)</dark_gray>\n<white><hint>\n<dark_gray>Pedida por <player> · <red>-<penalty>s</red>"
hint-not-playing: "<red>Sólo puedes pedir pistas durante una partida."
hint-disabled: "<red>Esta sala no permite pistas."
hint-limit: "<red>Ya habéis usado las <max> pistas permitidas."
hint-none: "<gray>No quedan más pistas para los enigmas activos."

# ── Final ──
victory-title: "<gradient:#ffcf6b:#d4862a><b>¡HABÉIS ESCAPADO!</b></gradient>"
victory-subtitle: "<gray>Tiempo final: <white><time>"
victory-message: "<gold>🏆 Habéis escapado de <room> <gold>en <white><time></white> <gray>(<hints> pistas)."
victory-rank: "<gold>Vuestro tiempo es el <white>#<rank></white> del ranking de <room><gold>."
defeat-title: "<dark_red><b>LA VELA SE HA APAGADO</b>"
defeat-subtitle: "<gray>La torre os reclama..."
defeat-message: "<red>Se acabó el tiempo en <room><red>. Volvéis al lobby; ¡suerte la próxima vez!"
game-aborted: "<gray>La partida se ha cancelado."
reward-money: "<green>+<amount> monedas por escapar."

