info:
  - "<gold><b><room></b> <dark_gray>[<gray><id></gray>]"
  - " <gray>Estado: <white><state>"
  - " <gray>Tiempo límite: <white><time>"
  - " <gray>Jugadores: <white><min>–<max>"
  - " <gray>Puzles: <white><puzzles>"
  - " <gray>Pistas: <white><hints></white> <dark_gray>(penalización <penalty>s)"
  - " <gray>Mejor tiempo: <white><best>"
  - " <gray>Snapshot guardado: <white><snapshot>"
stats:
  - "<gold><b>Estadísticas de <player></b>"
  - " <gray>Partidas: <white><plays>"
  - " <gray>Victorias: <green><wins></green> <dark_gray>· <gray>Derrotas: <red><losses>"
  - " <gray>Mejores tiempos: <white><bests>"

