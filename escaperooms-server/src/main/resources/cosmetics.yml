# Cosméticos (solo estética, nunca ayudan en las salas).
# Cada uno: name, icon (material), description, price-keys / price-gems (0 = no se vende), unlock (texto de cómo se consigue)
# Se pueden dar con permisos: escaperooms.cosmetic.<tipo>.<id>  (o .* para todos los de un tipo)

titles:
  curioso: {name: "<gray>Curioso", icon: NAME_TAG, display: "<gray>[Curioso]", price-keys: 300}
  detective: {name: "<aqua>Detective", icon: NAME_TAG, display: "<aqua>[Detective]", price-keys: 1500}
  alquimista: {name: "<gold>Alquimista", icon: BREWING_STAND, display: "<gold>[Alquimista]", price-keys: 2500}
  cerrajero: {name: "<yellow>Cerrajero", icon: TRIPWIRE_HOOK, display: "<yellow>[Cerrajero]", price-gems: 30}
  fantasma: {name: "<white>Fantasma", icon: PHANTOM_MEMBRANE, display: "<white>[👻 Fantasma]", price-gems: 50}
  houdini: {name: "<gradient:#FFD700:#FF8C00>Houdini</gradient>", icon: CHAIN, display: "<gradient:#FFD700:#FF8C00>[Houdini]</gradient>", unlock: "Logro: Inescapable"}
  mente: {name: "<light_purple>Mente maestra", icon: ENCHANTED_BOOK, display: "<light_purple>[Mente maestra]", unlock: "Logro: Mente maestra"}
  genio: {name: "<aqua>Genio", icon: KNOWLEDGE_BOOK, display: "<aqua>[Genio]", unlock: "Logro: Genio"}

trails:
