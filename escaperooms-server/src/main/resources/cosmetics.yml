  detective_cap:
    name: "<gold>Gorra de detective"
    icon: BROWN_WOOL
    price-gems: 45
    item: {material: BROWN_CARPET, model: "escape:hat_detective", name: "<gold>Gorra de detective"}
  pumpkin:
    name: "<gold>Calabaza"
    icon: CARVED_PUMPKIN
    price-keys: 800
    item: {material: CARVED_PUMPKIN, name: "<gold>Calabaza"}
  crown:
    name: "<yellow>Corona"
    icon: GOLD_BLOCK
    price-gems: 150
    item: {material: GOLD_NUGGET, model: "escape:hat_crown", name: "<yellow>Corona"}

victory:
  confetti: {name: "<yellow>Confeti", icon: FIREWORK_ROCKET, colors: ["#FF4444", "#44FF44", "#4488FF", "#FFFF44"], shape: BURST, count: 4, price-keys: 1000}
  gold_rain: {name: "<gold>Lluvia de oro", icon: GOLD_INGOT, colors: ["#FFD700", "#FFA500"], shape: BALL_LARGE, count: 5, particle: DUST, color: "#FFD700", price-gems: 60}
  creeper: {name: "<green>Creeper", icon: CREEPER_HEAD, colors: ["#22CC22"], shape: CREEPER, count: 3, price-keys: 2500}
