  aurora: {name: "<aqua>Aurora", icon: PRISMARINE_CRYSTALS, colors: ["#00FFCC", "#7700FF", "#00AAFF"], shape: BALL_LARGE, count: 6, flicker: true, unlock: "Logro: Inquebrantable"}

