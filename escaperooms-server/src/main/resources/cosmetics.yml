  hearts: {name: "<red>Corazones", icon: RED_DYE, particle: HEART, count: 1, spread: 0.2, price-keys: 1500}
  notes: {name: "<green>Notas musicales", icon: NOTE_BLOCK, particle: NOTE, count: 1, spread: 0.3, price-keys: 1500}
  magic: {name: "<light_purple>Magia", icon: AMETHYST_SHARD, particle: WITCH, count: 4, spread: 0.2, price-gems: 40}
  soul: {name: "<dark_aqua>Almas", icon: SOUL_LANTERN, particle: SOUL_FIRE_FLAME, count: 2, spread: 0.1, speed: 0.01, price-gems: 60}
  stars: {name: "<yellow>Estrellas", icon: NETHER_STAR, particle: END_ROD, count: 2, spread: 0.2, speed: 0.01, unlock: "Logro: Constelación"}
  gold_dust: {name: "<gold>Polvo dorado", icon: GOLD_NUGGET, particle: DUST, color: "#FFD700", size: 1.2, count: 4, spread: 0.25, price-gems: 80}

hats:
