  stars_30: {name: "Astrónomo", description: "Reúne 30 estrellas.", stat: stars, amount: 30, icon: GLOWSTONE_DUST, reward: {keys: 800}}
  cine_5: {name: "Cinéfilo", description: "Escapa 5 veces de salas de Cine.", stat: wing_cine_wins, amount: 5, icon: RED_CANDLE, reward: {keys: 300}}
  anime_5: {name: "Otaku", description: "Escapa 5 veces de salas de Anime.", stat: wing_anime_wins, amount: 5, icon: CHERRY_SAPLING, reward: {keys: 300}}
  games_5: {name: "Gamer", description: "Escapa 5 veces de salas de Videojuegos.", stat: wing_videojuegos_wins, amount: 5, icon: TARGET, reward: {keys: 300}}
  parkour_1: {name: "Saltarín", description: "Completa el parkour del lobby.", stat: parkours, amount: 1, icon: FEATHER, reward: {keys: 100}}
  quests_25: {name: "Cumplidor", description: "Completa 25 misiones.", stat: quests, amount: 25, icon: WRITABLE_BOOK, reward: {gems: 15}}
  playtime_24: {name: "Veterano", description: "Juega 24 horas en el servidor.", stat: playtime_hours, amount: 24, icon: CLOCK, reward: {gems: 20}}
