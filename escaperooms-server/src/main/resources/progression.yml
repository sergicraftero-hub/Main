  level_50: {name: "Nivel 50", description: "Llega al nivel 50.", stat: level, amount: 50, icon: EXPERIENCE_BOTTLE, reward: {gems: 50}, broadcast: true}
  streak_7: {name: "Fiel", description: "Reclama la recompensa diaria 7 días seguidos.", stat: daily_streak, amount: 7, icon: CLOCK, reward: {gems: 10}}
